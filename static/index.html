<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Graph fight!</title>
  </head>
  <body style="background-color: rgb(223, 223, 223);">
    <noscript>This page contains webassembly and javascript content, please enable javascript in your browser.</noscript>

    <section id="lobby">
      <h1>Graph fight!</h1>
      <h2>Open games</h2>
      <table>
        <thead><tr><th>Name</th><th>Field</th><th>Players</th><th></th></tr></thead>
        <tbody id="games"></tbody>
      </table>
      <h2>Host a game</h2>
      <form id="host-form">
        <label>Name <input id="host-name" value="game" maxlength="64"></label>
        <label>Field
          <select id="host-field">
            <option value="xy">xy (2 players)</option>
            <option value="disc">disc</option>
          </select>
        </label>
        <label>Seats <input id="host-seats" type="number" min="2" value="2" disabled></label>
        <button type="submit">Host</button>
      </form>
    </section>

    <section id="room" hidden>
      <h2>Waiting room</h2>
      <ul id="room-players"></ul>
      <button id="start" type="button">Start</button>
      <button id="leave" type="button">Leave</button>
    </section>

    <section id="game" hidden>
      <canvas id="arena" width="800" height="400" style="outline: black 1px solid"></canvas>
    </section>

    <p id="error"></p>

    <section id="end" hidden>
      <p id="end-message"></p>
      <button id="back" type="button">Back to lobby</button>
    </section>

    <script src="./index.js"></script>
  </body>
</html>

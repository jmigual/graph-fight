name: Release check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  new-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the top CHANGELOG version is not already tagged
        run: node scripts/release-check.mjs free

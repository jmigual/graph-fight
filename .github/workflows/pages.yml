name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GRAPH_FIGHT_LOBBY: live
      - name: Check the build announces on the live lobby topic
        run: |
          grep -qF '"graph-fight:lobby"' dist/index.js
          if grep -qF '"graph-fight:lobby:dev"' dist/index.js; then exit 1; fi
      - name: Check the build is the version at the top of CHANGELOG.md
        run: |
          version=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { parseChangelog } from "./scripts/changelog.mjs"; console.log(parseChangelog(readFileSync("CHANGELOG.md", "utf8"))[0].version)')
          test -n "$version"
          grep -qF "\"$version+" dist/index.js
          grep -qF "<h2 id=\"v$version\">" dist/changelog.html
          if grep -qF -- '-dev+' dist/index.js; then exit 1; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
